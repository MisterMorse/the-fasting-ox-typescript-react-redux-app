user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name loveladybaptist.com www.loveladybaptist.com;

        # Enforce priority routing for Certbot challenges
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri = 404;
        }

        # Redirect all general HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name loveladybaptist.com www.loveladybaptist.com;

        ssl_certificate /etc/letsencrypt/live/loveladybaptist.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/loveladybaptist.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # API routing
        location ^~ /api/v1/ {
            proxy_pass http://the-fasting-ox-python-django-api:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django static files
        location ^~ /static/ {
            alias /usr/share/nginx/html/django_static/;
        }

        # API admin portal
        location ^~ /admin/ {
            proxy_pass http://the-fasting-ox-python-django-api:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React frontend router
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # React assets caching
        location ~* ^(?!/(api|admin|static/)).*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
